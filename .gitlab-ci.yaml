stages:
  - build
  - deploy_infra

variables:
  AWS_REGION: "eu-central-1"

# Image with Terraform and AWS CLI installed
image: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest

before_script:
  - aws --version
  - terraform --version
  # Configure AWS credentials via GitLab CI variables (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)
  - export AWS_DEFAULT_REGION="$AWS_REGION"

build_images:
  stage: build
  image: docker:24.0.7
  services:
    - docker:24.0.7-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - echo "Logging in to Amazon ECR"
    - aws ecr get-login-password --region $AWS_REGION \
        | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
  script:
    - echo "Building backend image"
    - docker build -t backend ./backend
    - echo "Building frontend image"
    - docker build -t frontend ./frontend
    - echo "Tagging images"
    - docker tag backend:latest "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/backend:latest"
    - docker tag frontend:latest "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/frontend:latest"
    - echo "Pushing images to ECR"
    - docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/backend:latest"
    - docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/frontend:latest"
  only:
    - main   #restricting only to main to ensure production deployments

# we can add a test job before deployment in a real-world scenario to validate the infrastructure

deploy_infra:
  stage: deploy_infra
  script:
    - cd terraform
    - terraform init
    - terraform validate
    - terraform plan -out=tfplan
    - terraform apply -auto-approve tfplan
  only:
    - main
